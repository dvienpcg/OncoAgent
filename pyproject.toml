[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoagent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.1.3",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "torch==2.5.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.6", "mypy==1.14.1"]

[project.scripts]
oncoagent = "oncoagent.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oncoagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["oncoagent"]

